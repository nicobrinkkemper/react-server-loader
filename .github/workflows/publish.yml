name: Build + pack

# Runs the build-rsl.sh pipeline against a given React ref and packs the
# resulting package into an inspectable tarball artifact. Triggered
# manually so the maintainer chooses which React tag becomes a
# react-server-loader release.
#
# This workflow NEVER publishes and holds no npm credentials. Publishing
# is done locally from the maintainer's machine (`npm publish <tgz>`),
# so a long-lived npm token never lives on GitHub. Download the artifact
# this job uploads and publish that exact tarball — see the run Summary.

on:
  workflow_dispatch:
    inputs:
      react_ref:
        description: "facebook/react git ref to build against (tag, branch, or commit SHA)"
        type: string
        required: true
        default: "main"
      channel:
        description: "React release channel"
        type: choice
        required: true
        default: experimental
        options:
          - experimental
          - stable

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout react-server-loader
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Java (Google Closure Compiler — used by React's build)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable yarn (React's repo uses yarn workspaces)
        run: corepack enable

      - name: Install rsl deps
        run: npm install

      - name: Build the TypeScript surface
        run: npm run build

      - name: Run unit tests
        run: npx vitest --run

      - name: Build the vendored react-server-dom-esm
        run: |
          bash scripts/build-rsl.sh \
            --channel "${{ inputs.channel }}" \
            --react-ref "${{ inputs.react_ref }}"

      - name: Sync version + peer deps to the vendored react-server-dom-esm
        id: version
        run: |
          # rsl's version and react/react-dom peer range mirror the vendored
          # transport exactly, so each train (stable / experimental) ships a
          # peer range that matches the React build it was vendored against.
          # Stable -> react ^19.x; experimental -> the 0.0.0-experimental-<sha>
          # build, whose transport pins the matching experimental react.
          VERSION=$(node -p "require('./vendor/react-server-dom-esm/package.json').version")
          echo "react-server-dom-esm version: $VERSION"
          node -e '
            const fs = require("fs");
            const transport = require("./vendor/react-server-dom-esm/package.json");
            const pkg = require("./package.json");
            const peers = transport.peerDependencies || {};
            pkg.peerDependencies = {
              ...pkg.peerDependencies,
              react: peers.react || pkg.peerDependencies?.react,
              "react-dom": peers["react-dom"] || pkg.peerDependencies?.["react-dom"],
            };
            fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log("synced peerDependencies:", JSON.stringify(pkg.peerDependencies));
          '
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve npm dist-tag from channel
        id: tag
        run: |
          # Experimental builds belong under the `experimental` dist-tag so
          # they never move `latest`. Stable builds take `latest`. This is
          # informational only — the maintainer applies it at `npm publish`
          # time locally (this workflow never publishes).
          if [ "${{ inputs.channel }}" = "experimental" ]; then
            echo "tag=experimental" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack tarball
        run: npm pack

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: react-server-loader-${{ steps.version.outputs.version }}
          path: react-server-loader-*.tgz
          retention-days: 30

      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.tag.outputs.tag }}"
          echo "### Build summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| React ref | \`${{ inputs.react_ref }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Channel | ${{ inputs.channel }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | $VERSION |" >> "$GITHUB_STEP_SUMMARY"
          echo "| npm dist-tag | $TAG |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Publish locally (no npm token lives on GitHub):" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "gh run download ${{ github.run_id }} -R ${{ github.repository }} -D ./rsl-pub" >> "$GITHUB_STEP_SUMMARY"
          echo "npm publish ./rsl-pub/react-server-loader-$VERSION/react-server-loader-$VERSION.tgz --access public --tag $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
